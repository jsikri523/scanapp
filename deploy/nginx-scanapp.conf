# Add to /etc/nginx/sites-available/appx-router, inside the existing
# `server { listen 8080; server_name _; }` block, beside the other four apps.
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# WHY THIS DIFFERS FROM THE OTHER FOUR APPS
#
# They use:   rewrite ^/labelapp(/.*)$ $1 break;
#             proxy_pass http://unix:/run/gunicorn/labelapp.sock;
#
# That strips the prefix and tells the app nothing about it. scanapp builds
# every link with url_for(), so it needs SCRIPT_NAME set or it emits
# root-relative URLs like /static/scanapp.css, which the router would send to
# appx-entry instead. The X-Script-Name header is what app/__init__.py reads.
#
# The three proxy_set_header lines are repeated deliberately. nginx does not
# merge proxy_set_header across levels: declaring any one of them inside a
# location discards all the server-level ones, so they have to be restated.

location /scanapp/ {
    proxy_pass         http://unix:/run/gunicorn/scanapp.sock:/;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Script-Name     /scanapp;

    # Scans are small and frequent. Fail fast so the tablet queues and retries
    # rather than sitting on a hung request in front of the operator.
    proxy_connect_timeout 3s;
    proxy_read_timeout    10s;
}
