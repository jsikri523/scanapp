# Add to /etc/nginx/sites-enabled/appx-router, inside the existing server block.
# The other four apps (labelapp, locationapp, signapp, logoapp) follow this
# same shape, so this slots in beside them.
#
#   sudo nginx -t && sudo systemctl reload nginx

location /scanapp/ {
    proxy_pass         http://unix:/run/gunicorn/scanapp.sock:/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Script-Name     /scanapp;

    # Scans are small and frequent. Fail fast so the tablet queues and
    # retries rather than sitting on a hung request in front of the operator.
    proxy_connect_timeout 3s;
    proxy_read_timeout    10s;
}
